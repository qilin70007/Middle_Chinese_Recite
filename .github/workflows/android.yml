name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check learning application JavaScript
        run: node --check app.js

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK contents and playback service
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -F "assets/www/index.html" /tmp/apk-files.txt
          grep -F "assets/www/app.js" /tmp/apk-files.txt
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/manifest.xml
          grep -F "com.qilin.chineserecite.PlaybackService" /tmp/manifest.xml
          grep -F "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" /tmp/manifest.xml

      - name: Prepare download
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Middle_Chinese_Recite-latest.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Middle_Chinese_Recite-Android
          path: output/Middle_Chinese_Recite-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "最新测试版 APK" --notes "由 GitHub Actions 自动构建的可安装测试版。" --prerelease
          gh release upload latest output/Middle_Chinese_Recite-latest.apk --clobber
